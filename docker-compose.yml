# Voicebox — CPU build (Tuned for 12 ARM64 vCores & 24GB RAM)

services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped

    ports:
      - "127.0.0.1:17600:17493"

    volumes:
      - ./output:/app/data/generations
      - voicebox-data:/app/data
      - huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      # Allow PyTorch to utilize the allocated ARM cores
      - OMP_NUM_THREADS=10
      - OPENBLAS_NUM_THREADS=10
      - MKL_NUM_THREADS=10

    networks:
      - voicebox-net

    deploy:
      resources:
        limits:
          cpus: '10'
          memory: 18G

networks:
  voicebox-net:
    driver: bridge

volumes:
  voicebox-data:
  huggingface-cache:
